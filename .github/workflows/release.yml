name: Portable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build or recover
        required: true
        type: string
      build_run:
        description: Recovery only; original release build run ID (pair with macos_run)
        required: false
        default: ''
        type: string
      macos_run:
        description: Recovery only; successful macOS run ID (pair with build_run)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: portable-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_run == '' && inputs.macos_run == '')
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate versions and resource lock
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          namespace = {}
          exec(Path('backend/__init__.py').read_text(encoding='utf-8'), namespace)
          version = namespace['__version__']
          assert version == json.loads(Path('web/package.json').read_text())['version'], 'Backend/frontend versions differ'
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', tag), 'Use a vMAJOR.MINOR.PATCH tag'
          assert tag == 'v' + version, 'Tag and application versions differ'
          catalog = json.loads(Path('backend/setup/vocabularies.json').read_text(encoding='utf-8'))
          assert re.fullmatch(r'corpus-editions-[0-9a-f]{64}', catalog['release_tag'])
          assert catalog['release_tag'] == 'corpus-editions-' + catalog['fingerprint']
          assert set(catalog['editions']) == {'filtered', 'all-ratings'}
          for edition, entry in catalog['editions'].items():
              assert entry['file']['path'] == 'pictide-vocabulary-' + edition + '.sqlite3'
              assert entry['file']['bytes'] > 0 and re.fullmatch(r'[0-9a-f]{64}', entry['file']['sha256'])
      - name: Install application dependencies for core smokes
        run: python -m pip install --no-cache-dir -r backend/requirements.txt
      - name: Check core and packaging behavior before native builds
        run: |
          # HTTP core fixtures register static routes before the frontend is built.
          mkdir -p web/dist
          python scripts/check.py core
          python -m unittest tests.scripts.test_portable_startup tests.scripts.test_portable_audit -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the pinned frontend tools
        shell: python
        run: |
          import json, shutil, subprocess
          from pathlib import Path
          manager = json.loads(Path('web/package.json').read_text())['packageManager']
          assert manager.startswith('pnpm@')
          subprocess.run([shutil.which('npm'), 'install', '--global', manager], check=True)
          subprocess.run(['pnpm', '--dir', 'web', 'install', '--frozen-lockfile'], check=True)
      - name: Check UI logic and compile the isolated browser frontend
        run: |
          python scripts/check.py ui
          pnpm --dir web run typecheck
          pnpm --dir web run build --out-dir ../dev/verification/browser/dist
      - name: Prepare the smoke browser
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Check browser interactions with isolated data and a fake image service
        run: python scripts/check.py browser
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-diagnostics
          path: dev/verification/browser/
          if-no-files-found: ignore
          retention-days: 1

  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_run == '' && inputs.macos_run == '')
    needs: validate
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows-x64, os: windows-2022}
          - {platform: linux-x64, os: ubuntu-22.04}
          - {platform: macos-arm64, os: macos-15}
          - {platform: macos-x64, os: macos-15-intel}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the pinned pnpm version
        shell: python
        run: |
          import json, subprocess, shutil
          from pathlib import Path
          manager = json.loads(Path('web/package.json').read_text())['packageManager']
          assert manager.startswith('pnpm@')
          subprocess.run([shutil.which('npm'), 'install', '--global', manager], check=True)
      - name: Install packaging dependencies
        env:
          # Intel macOS builds cryptography from source; isolate its OpenSSL from Python's dylibs.
          OPENSSL_STATIC: '1'
        run: python -m pip install --no-cache-dir -r backend/requirements-release.txt
      - name: Build the native portable package
        run: python scripts/build_portable.py
      - name: Smoke test the extracted package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/smoke_portable.py --archive releases/*.zip --report dev/verification/portable/smoke-report.json --previous-release
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            dev/verification/portable/**/build-report.json
            dev/verification/portable/smoke-report.json
          if-no-files-found: ignore
          retention-days: 1
      - name: Collect release assets
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        shell: python
        run: |
          import os, shutil
          from pathlib import Path
          source = Path('releases')
          reports = Path('dev/verification/portable')
          target = Path('dev/build/release-assets')
          target.mkdir(parents=True)
          archives = list(source.glob('*.zip'))
          assert len(archives) == 1
          shutil.copyfile(archives[0], target / archives[0].name)
          for name in ('build-report', 'smoke-report'):
              matches = list(reports.rglob(name + '.json'))
              assert len(matches) == 1, 'Expected one ' + name
              shutil.copyfile(matches[0], target / (name + '-' + os.environ['BUILD_PLATFORM'] + '.json'))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-${{ matrix.platform }}
          path: dev/build/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.build_run != '' && inputs.macos_run != ''))
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-*
          path: dev/build/release-assets
          merge-multiple: true
          run-id: ${{ inputs.build_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.build_run != '' && inputs.macos_run != ''
        with:
          pattern: pictide-macos-*-${{ inputs.macos_run }}
          merge-multiple: true
          path: dev/build/macos-recovery
          run-id: ${{ inputs.macos_run }}
          github-token: ${{ github.token }}
      - name: Verify recovery provenance and collect the missing platform
        if: github.event_name == 'workflow_dispatch' && inputs.build_run != '' && inputs.macos_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.build_run }}
          MACOS_RUN: ${{ inputs.macos_run }}
        shell: python
        run: |
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          def run_record(key):
              run = os.environ[key]
              assert run.isdecimal(), 'Invalid run ID'
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + '/actions/runs/' + run]))
          assert run_record('BUILD_RUN')['head_sha'] == commit, 'Original build source differs'
          assert run_record('MACOS_RUN')['conclusion'] == 'success', 'Mac validation did not pass'
          source = Path('dev/build/macos-recovery')
          provenance = json.loads((source / 'source.json').read_text())
          assert provenance['commit'] == commit, 'Mac validation source differs'
          platform = {'apple-silicon': 'macos-arm64', 'intel': 'macos-x64'}[provenance['architecture']]
          archives = list(source.glob('*.zip'))
          assert len(archives) == 1 and archives[0].name == provenance['archive']
          with archives[0].open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == provenance['sha256']
          target = Path('dev/build/release-assets')
          assert not (target / archives[0].name).exists(), 'Do not replace an existing platform asset'
          shutil.copyfile(archives[0], target / archives[0].name)
          for name in ('build-report', 'smoke-report'):
              shutil.copyfile(source / (name + '.json'), target / (name + '-' + platform + '.json'))
      - name: Check assets, write checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: python
        run: |
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          directory = Path('dev/build/release-assets')
          assert len(list(directory.glob('*.zip'))) == 4, 'Expected four native archives'
          reports = list(directory.glob('smoke-report-*.json'))
          assert len(reports) == 4
          assert all(json.loads(path.read_text())['passed'] for path in reports), 'Smoke checks must pass'
          assert len(list(directory.glob('build-report-*.json'))) == 4
          from scripts.release_updates import write_manifest
          write_manifest(directory)
          files = sorted(directory.iterdir())
          checksums = directory / 'SHA256SUMS'
          with checksums.open('w', encoding='utf-8', newline='\n') as handle:
              for path in files:
                  with path.open('rb') as source:
                      digest = hashlib.file_digest(source, 'sha256').hexdigest()
                  handle.write(digest + '  ' + path.name + '\n')
          from backend import __version__
          tag = os.environ['RELEASE_TAG']
          assert tag == 'v' + __version__, 'Release tag differs from source version'
          command = ['gh', 'release', 'create', tag, '--verify-tag', '--generate-notes', '--draft', '--title', tag]
          if '-' in tag:
              command.append('--prerelease')
          command.extend(str(path) for path in files + [checksums])
          # Creation refuses an existing release; it never replaces another run's assets.
          subprocess.run(command, check=True)
          subprocess.run(['gh', 'release', 'edit', tag, '--draft=false'], check=True)
