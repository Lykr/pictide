name: Validate macOS app

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or tag to validate (empty uses this workflow revision)
        type: string
        default: ''
      previous_release:
        description: Optional previous release tag to download with authentication
        type: string
        default: ''
      architecture:
        description: Mac architecture
        type: choice
        default: intel
        options: [intel, apple-silicon]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ inputs.architecture == 'intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the pinned pnpm version
        shell: python
        run: |
          import json, shutil, subprocess
          from pathlib import Path
          manager = json.loads(Path('web/package.json').read_text())['packageManager']
          assert manager.startswith('pnpm@')
          subprocess.run([shutil.which('npm'), 'install', '--global', manager], check=True)
      - name: Install packaging dependencies
        env:
          # Intel macOS builds cryptography from source; isolate its OpenSSL from Python's dylibs.
          OPENSSL_STATIC: '1'
        run: python -m pip install --no-cache-dir -r backend/requirements-release.txt
      - name: Check desktop lifecycle
        run: >-
          python -m unittest -v
          tests.backend.desktop.test_desktop_launcher
          tests.backend.runtime.test_runtime_logging
          tests.backend.runtime.test_managed_output_logging
          tests.backend.task.test_job_logging
          tests.backend.runtime.test_network
      - name: Build the native app
        run: python scripts/build_portable.py
      - name: Check the extracted app
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RELEASE: ${{ inputs.previous_release }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from backend import __version__
          archives = list(Path('releases').glob('*.zip'))
          assert len(archives) == 1
          archive = archives[0]
          command = [sys.executable, 'scripts/smoke_portable.py', '--archive', str(archive),
                     '--report', 'dev/verification/portable/smoke-report.json']
          previous = os.environ['PREVIOUS_RELEASE']
          if previous:
              assert re.fullmatch(r'v\d+\.\d+\.\d+', previous), 'Use a stable release tag'
              suffix = archive.name.removeprefix('pictide-' + __version__ + '-')
              name = 'pictide-' + previous[1:] + '-' + suffix
              destination = Path('dev/cache/previous-release')
              destination.mkdir(parents=True)
              subprocess.run(['gh', 'release', 'download', previous, '--pattern', name,
                              '--dir', str(destination)], check=True)
              command.extend(['--previous-archive', str(destination / name)])
          else:
              command.append('--previous-release')
          subprocess.run(command, check=True)
      - name: Collect verified package and provenance
        env:
          TARGET_ARCHITECTURE: ${{ inputs.architecture }}
        shell: python
        run: |
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          target = Path('dev/build/validation-assets')
          target.mkdir(parents=True)
          archives = list(Path('releases').glob('*.zip'))
          assert len(archives) == 1
          source = archives[0]
          with source.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          shutil.copyfile(source, target / source.name)
          (target / 'SHA256SUMS').write_text(digest + '  ' + source.name + '\n')
          (target / 'source.json').write_text(json.dumps({
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'architecture': os.environ['TARGET_ARCHITECTURE'],
              'archive': source.name, 'sha256': digest,
          }, indent=2) + '\n')
          for name in ('build-report', 'smoke-report'):
              reports = list(Path('dev/verification/portable').rglob(name + '.json'))
              assert len(reports) == 1
              shutil.copyfile(reports[0], target / (name + '.json'))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pictide-macos-${{ inputs.architecture }}-${{ github.run_id }}
          path: dev/build/validation-assets/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-diagnostics-${{ github.run_id }}
          path: dev/verification/
          retention-days: 7
          if-no-files-found: ignore
